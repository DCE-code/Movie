<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEBULA | Interactive Cinema</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Move.css">
</head>
<body>

    <!-- Accessible Landmark Skip Anchor -->
    <a href="#main-content" class="skip-to-content">Skip to content</a>

    <!-- Universal Structural Page Preloader Layer -->
    <div id="cinema-preloader" role="alert" aria-live="assertive" aria-busy="true">
        <p class="preloader-text">PROJECTING</p>
    </div>

    <!-- Hidden Accessible Navigation Sidebar Drawer Component -->
    <nav id="sidebar-nav" class="sidebar-panel" aria-label="Global Options Navigation Menu" aria-hidden="true">
        <button class="sidebar-close" type="button" aria-label="Close options window">CLOSE ×</button>
        <ul class="sidebar-links"></ul>
    </nav>

    <!-- Fixed Global Navigation Header Bar Container -->
    <header class="site-header">
        <button class="menu-toggle" type="button" aria-label="Open context options panel" aria-expanded="false">
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
    </header>

    <!-- Main System Content Core Pipeline Component -->
    <main id="main-content">
        <div id="cinema-platform-target"></div>
    </main>

    <!-- Fully Decoupled Interactive Theatre Overlay Canvas Modal -->
    <div id="video-overlay" class="video-overlay" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Official Video Presentation Stage">
        <div class="curtain-panel left-panel"></div>
        <div class="curtain-panel right-panel"></div>
        
        <div class="video-stage">
            <button class="close-video" type="button" aria-label="Terminate presentation player window">CLOSE ×</button>
            <div class="video-responsive-ratio">
                <iframe id="trailer-video" src="" title="Dynamic Cinematic Trailer Target Stream Node" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script src="Move.js"></script>
</body>
</html>
