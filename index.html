<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEBULA | Interactive Cinema</title>
    <meta
      name="description"
      content="NEBULA — an interactive cinema promo site showcasing trailers and production credits."
    />
    <meta name="theme-color" content="#050505" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="css/style.css" as="style" />
    <link rel="stylesheet" href="css/style.css" />
    <meta property="og:title" content="NEBULA | Interactive Cinema" />
    <meta
      property="og:description"
      content="An interactive promo site featuring trailers and production details."
    />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <!-- Accessible Landmark Skip Anchor -->
    <a href="#main-content" class="skip-to-content">Skip to content</a>

    <!-- Universal Structural Page Preloader Layer -->
    <div
      id="cinema-preloader"
      role="alert"
      aria-live="assertive"
      aria-busy="true"
    >
      <p class="preloader-text">PROJECTING</p>
    </div>

    <!-- Hidden Accessible Navigation Sidebar Drawer Component -->
    <nav
      id="sidebar-nav"
      class="sidebar-panel"
      aria-label="Global Options Navigation Menu"
      aria-hidden="true"
    >
      <button
        class="sidebar-close"
        type="button"
        aria-label="Close options window"
      >
        CLOSE ×
      </button>
      <ul class="sidebar-links"></ul>
    </nav>

    <!-- Fixed Global Navigation Header Bar Container -->
    <header class="site-header">
      <button
        class="menu-toggle"
        type="button"
        aria-label="Open context options panel"
        aria-expanded="false"
      >
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    </header>

    <!-- Main System Content Core Pipeline Component -->
    <main id="main-content">
      <div id="cinema-platform-target"></div>
    </main>

    <!-- Fully Decoupled Interactive Theatre Overlay Canvas Modal -->
    <div
      id="video-overlay"
      class="video-overlay"
      aria-hidden="true"
      role="dialog"
      aria-modal="true"
      aria-label="Official Video Presentation Stage"
    >
      <div class="curtain-panel left-panel"></div>
      <div class="curtain-panel right-panel"></div>

      <div class="video-stage">
        <button
          class="close-video"
          type="button"
          aria-label="Terminate presentation player window"
        >
          CLOSE ×
        </button>
        <div class="video-responsive-ratio">
          <iframe
            id="trailer-video"
            src=""
            title="Dynamic Cinematic Trailer Target Stream Node"
            frameborder="0"
            allow="
              accelerometer;
              autoplay;
              clipboard-write;
              encrypted-media;
              gyroscope;
              picture-in-picture;
            "
            allowfullscreen
          ></iframe>
        </div>
      </div>
    </div>

    <noscript
      ><p style="color: #fff; text-align: center; padding: 1rem">
        This site requires JavaScript for the full experience. Please enable
        JavaScript in your browser.
      </p></noscript
    >
    <script src="js/app.js" defer></script>
  </body>
</html>
